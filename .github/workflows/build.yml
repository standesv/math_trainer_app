name: Build APK & AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compute version
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/v*) NAME="${GITHUB_REF_NAME#v}" ;;
            *)            NAME="0.0.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "APP_VERSION_NAME=$NAME"          >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Version : $NAME (code $GITHUB_RUN_NUMBER)"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Keystore fourni par les secrets du depot."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PATH=$KS"           >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS"            >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD"  >> "$GITHUB_ENV"
          else
            echo "::warning::Aucun keystore dans les secrets - cle ephemere generee."
            echo "::warning::Cet APK ne pourra pas mettre a jour une installation existante."
            keytool -genkeypair -v -keystore "$KS" -alias mathtrainer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mathtrainer -keypass mathtrainer \
              -dname "CN=Stan Desvoye, O=Personal, C=FR"
            echo "KEYSTORE_PATH=$KS"        >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=mathtrainer" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=mathtrainer"    >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=mathtrainer" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        run: |
          gradle --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE" \
            assembleRelease bundleRelease

      - name: Verify AdMob App ID in merged manifest
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*release*' | head -1)
          echo "Manifeste : $MANIFEST"
          grep -n -A1 "APPLICATION_ID" "$MANIFEST" || true

          if ! grep -q 'ca-app-pub-3209259150498249~7379927993' "$MANIFEST"; then
            echo "::error::App ID AdMob absent du manifeste fusionne."
            exit 1
          fi
          echo "OK : App ID AdMob present."

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)

          [ -n "$APK" ] || { echo "::error::APK introuvable"; exit 1; }
          [ -n "$AAB" ] || { echo "::error::AAB introuvable"; exit 1; }

          cp "$APK" "dist/MathsTrainer-${APP_VERSION_NAME}.apk"
          cp "$AAB" "dist/MathsTrainer-${APP_VERSION_NAME}.aab"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MathsTrainer-${{ env.APP_VERSION_NAME }}-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: MathsTrainer-${{ env.APP_VERSION_NAME }}-AAB
          path: dist/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
