name: Build APK & AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Keystore fourni via les secrets du dépôt."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASS="$STORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::Aucun keystore dans les secrets - génération d'un keystore éphémère."
            echo "::warning::Cet APK ne peut PAS servir à mettre à jour une installation existante ni à publier sur le Play Store."
            STORE_PASS="mathtrainer"
            ALIAS="mathtrainer"
            KEY_PASS="mathtrainer"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Stan Desvoye, O=Personal, C=FR"
          fi

          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "$KEYSTORE_PATH",
                "storePassword": "$STORE_PASS",
                "alias": "$ALIAS",
                "password": "$KEY_PASS",
                "keystoreType": "jks"
              }
            }
          }
          EOF

      - name: Add Android platform
        run: npx cordova platform add android --no-telemetry

      - name: Build APK (release, signed)
        run: npx cordova build android --release --no-telemetry -- --packageType=apk

      - name: Build AAB (release, signed)
        run: npx cordova build android --release --no-telemetry -- --packageType=bundle

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find platforms/android -name '*.apk' -path '*release*' -exec cp {} dist/MathsTrainer.apk \;
          find platforms/android -name '*.aab' -path '*release*' -exec cp {} dist/MathsTrainer.aab \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MathsTrainer-APK
          path: dist/MathsTrainer.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: MathsTrainer-AAB
          path: dist/MathsTrainer.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MathsTrainer.apk
            dist/MathsTrainer.aab
          generate_release_notes: true
